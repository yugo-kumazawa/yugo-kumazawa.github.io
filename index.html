<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphics Lab</title>
<meta name="description" content="グラフィックを試作・検証するためのブラウザツール置き場。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%232f6df0' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%232f6df0' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%232f6df0'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main class="site">

  <h1 class="site__title">Graphics Lab</h1>
  <p class="site__lead">
    グラフィックを試作しながら確かめるための、小さなブラウザツールを置いています。
    どれもインストール不要で、ファイルは端末の外に出ません。
  </p>

  <ul class="tools">
    <li>
      <a class="tool" href="ripple/">
        <span class="tool__name">Ripple — SVG 波紋ジェネレーター</span>
        <span class="tool__desc">
          任意の SVG を拡大しながら重ね、波紋状のグラフィックをつくります。
          等差と等比の見え方の違い、複数色の塗り分け、原点の指定を切り替えながら試せます。
        </span>
        <span class="tool__tags">
          <span class="tool__tag">SVG</span>
          <span class="tool__tag">等差 / 等比</span>
          <span class="tool__tag">配色</span>
          <span class="tool__tag">SVG・PNG 書き出し</span>
        </span>
      </a>
    </li>
  </ul>

  <p class="site__foot">
    処理はすべてブラウザ内で完結します。読み込んだファイルがどこかへ送られることはありません。
  </p>

</main>
</body>
</html>
